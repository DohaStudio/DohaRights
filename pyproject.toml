[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doharights"
version = "0.1.0"
description = "Shared DohaStudio Rights and Licensing canonical authority"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.4"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "psycopg[binary]==3.3.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.setuptools.package-data]
"src.doharights" = ["postgres_migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = ["integration: requires the explicitly configured ephemeral PostgreSQL fixture"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
